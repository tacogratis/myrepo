name: CI Build and Security Scan

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Phylum OSS Supply Chain Security Scan
        uses: phylum-dev/phylum-analyze-pr-action@v2
        id: phylum-scan
        with:
          phylum_token: ${{ secrets.PHYLUM_API_KEY }} 
          args: >
            analyze 
            --sbom-format cyclonedx 
            --policy-fail-level high
            .

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: phylum-sbom
          # The exact path to the generated SBOM will depend on the action's output/configuration
          path: phylum-security-report.cdx.json # Check Phylum documentation for exact filename
          retention-days: 5